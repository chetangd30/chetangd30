<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0821"/>
      <stop offset="30%" stop-color="#2E1065"/>
      <stop offset="65%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="textGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F3FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F5F3FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40,0 L0,0 L0,40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- base gradient -->
  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <!-- blueprint grid -->
  <rect width="1200" height="220" fill="url(#grid)"/>

  <!-- ambient glows -->
  <circle cx="150" cy="40" r="130" fill="url(#glowPink)" filter="url(#softBlur)">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="190" r="150" fill="url(#glowCyan)" filter="url(#softBlur)">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- circuit traces (left side) -->
  <g stroke="#C4B5FD" stroke-opacity="0.35" stroke-width="1.6" fill="none">
    <path d="M0,60 H70 V30 H150">
      <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,120 H40 V150 H130 V170">
      <animate attributeName="stroke-opacity" values="0.5;0.15;0.5" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M20,200 H90 V180 H180">
      <animate attributeName="stroke-opacity" values="0.2;0.45;0.2" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- circuit traces (right side) -->
  <g stroke="#67E8F9" stroke-opacity="0.35" stroke-width="1.6" fill="none">
    <path d="M1200,50 H1130 V80 H1050">
      <animate attributeName="stroke-opacity" values="0.5;0.15;0.5" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path d="M1200,140 H1160 V110 H1070 V95">
      <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="5.4s" repeatCount="indefinite"/>
    </path>
    <path d="M1200,190 H1120 V165 H1040">
      <animate attributeName="stroke-opacity" values="0.45;0.2;0.45" dur="3.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- circuit nodes -->
  <g fill="#E9D5FF" filter="url(#nodeGlow)">
    <circle cx="150" cy="30" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="170" r="2.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="180" r="2.5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="80" r="3">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="95" r="2.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="165" r="2.5">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- neural network motif (subtle, behind text) -->
  <g stroke="#A78BFA" stroke-opacity="0.25" stroke-width="1">
    <line x1="330" y1="40" x2="420" y2="70"/>
    <line x1="330" y1="40" x2="420" y2="110"/>
    <line x1="330" y1="100" x2="420" y2="70"/>
    <line x1="330" y1="100" x2="420" y2="110"/>
    <line x1="330" y1="100" x2="420" y2="150"/>
    <line x1="780" y1="60" x2="870" y2="35"/>
    <line x1="780" y1="60" x2="870" y2="90"/>
    <line x1="780" y1="115" x2="870" y2="90"/>
    <line x1="780" y1="115" x2="870" y2="150"/>
  </g>
  <g fill="#D8B4FE">
    <circle cx="330" cy="40" r="2.5"/>
    <circle cx="330" cy="100" r="2.5"/>
    <circle cx="420" cy="70" r="2.5"/>
    <circle cx="420" cy="110" r="2.5"/>
    <circle cx="420" cy="150" r="2.5"/>
    <circle cx="780" cy="60" r="2.5"/>
    <circle cx="780" cy="115" r="2.5"/>
    <circle cx="870" cy="35" r="2.5"/>
    <circle cx="870" cy="90" r="2.5"/>
    <circle cx="870" cy="150" r="2.5"/>
  </g>

  <!-- faint binary / code fragments -->
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#ffffff" fill-opacity="0.14">
    <text x="30" y="95">01001011</text>
    <text x="1000" y="130">&lt;/&gt; 10110</text>
    <text x="60" y="210">{ }</text>
    <text x="1090" y="55">import ai</text>
  </g>

  <!-- panel behind name for contrast -->
  <ellipse cx="600" cy="128" rx="380" ry="72" fill="url(#textGlow)" opacity="0.45"/>

  <!-- name -->
  <text x="600" y="128" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="70" font-weight="700"
        letter-spacing="2" fill="#F5F3FF" text-anchor="middle" dominant-baseline="middle"
        filter="url(#neonGlow)">
    CHETAN DAPHEDAR
  </text>

  <!-- code-bracket accents flanking the name -->
  <text x="185" y="130" font-family="'Fira Code', Consolas, monospace" font-size="46" font-weight="600"
        fill="#67E8F9" fill-opacity="0.5" text-anchor="middle" dominant-baseline="middle">
    &lt;
    <animate attributeName="fill-opacity" values="0.3;0.65;0.3" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="1015" y="130" font-family="'Fira Code', Consolas, monospace" font-size="46" font-weight="600"
        fill="#67E8F9" fill-opacity="0.5" text-anchor="middle" dominant-baseline="middle">
    /&gt;
    <animate attributeName="fill-opacity" values="0.65;0.3;0.65" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- accent underline with tick marks (circuit-style) -->
  <g stroke="#E9D5FF" stroke-width="2">
    <line x1="470" y1="160" x2="730" y2="160" stroke-opacity="0.6">
      <animate attributeName="x1" values="510;470;510" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="690;730;690" dur="5s" repeatCount="indefinite"/>
    </line>
    <circle cx="470" cy="160" r="3" fill="#E9D5FF" filter="url(#nodeGlow)"/>
    <circle cx="730" cy="160" r="3" fill="#E9D5FF" filter="url(#nodeGlow)"/>
  </g>
</svg>
