<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="35%" stop-color="#6D28D9"/>
      <stop offset="70%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#C4B5FD">
        <animate attributeName="stop-color"
          values="#C4B5FD;#F0ABFC;#C4B5FD" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0ABFC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F0ABFC" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="textGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F3FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5F3FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- base gradient -->
  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <!-- dot texture -->
  <rect width="1200" height="220" fill="url(#dots)"/>

  <!-- floating glow blobs -->
  <circle cx="140" cy="50" r="120" fill="url(#glow1)" filter="url(#softBlur)">
    <animate attributeName="cy" values="50;70;50" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="180" r="140" fill="url(#glow2)" filter="url(#softBlur)">
    <animate attributeName="cy" values="180;155;180" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="20" r="90" fill="url(#glow1)" filter="url(#softBlur)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- sparkle particles -->
  <g fill="#ffffff">
    <circle cx="90" cy="140" r="2.5" opacity="0.8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="60" r="1.8" opacity="0.6">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="45" r="2.2" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="110" r="1.6" opacity="0.5">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="150" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="190" r="1.7" opacity="0.5">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- waves -->
  <path d="M0,170 C150,140 300,200 450,170 C600,140 750,200 900,170 C1050,140 1150,180 1200,165 L1200,220 L0,220 Z" fill="url(#waveGrad)"/>
  <path d="M0,190 C200,160 400,210 600,190 C800,170 1000,210 1200,185 L1200,220 L0,220 Z" fill="#ffffff" fill-opacity="0.06"/>

  <!-- glow behind name -->
  <ellipse cx="600" cy="128" rx="360" ry="70" fill="url(#textGlow)" opacity="0.5"/>

  <!-- name -->
  <text x="600" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="800"
        fill="#ffffff" text-anchor="middle" dominant-baseline="middle"
        style="text-shadow:0 4px 18px rgba(0,0,0,0.35);">
    Chetan Daphedar
    <animate attributeName="opacity" values="0.92;1;0.92" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- thin accent underline -->
  <rect x="470" y="158" width="260" height="3" rx="1.5" fill="#ffffff" opacity="0.55">
    <animate attributeName="width" values="180;260;180" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="510;470;510" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
